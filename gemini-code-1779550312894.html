<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İzmit Lisesi — Film Öneri Portalı</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --surface: #13131e;
    --card: #1a1a2a;
    --border: #2a2a40;
    --accent: #7c5cfc;
    --accent-light: #a48bfd;
    --accent-glow: rgba(124,92,252,0.15);
    --text: #e8e8f2;
    --muted: #6868a0;
    --success: #3ecf8e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  .portal-header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    text-align: center;
  }

  .portal-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 4px;
    color: var(--text);
  }

  /* ── WRAPPER ── */
  .wrapper {
    width: 100%;
    max-width: 480px;
    padding: 36px 20px 60px;
  }

  /* ── FORM CARD ── */
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 28px 28px;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-icon {
    font-size: 2rem;
    text-align: center;
    margin-bottom: 10px;
  }

  .form-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.25rem;
    font-weight: 500;
    text-align: center;
    color: var(--text);
    margin-bottom: 6px;
  }

  .form-sub {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 28px;
  }

  .field-group {
    margin-bottom: 18px;
  }

  .field-label {
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
    font-weight: 400;
    display: block;
  }

  .field-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.93rem;
    font-weight: 300;
    padding: 13px 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .field-input::placeholder { color: var(--muted); opacity: 0.7; }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  textarea.field-input {
    resize: none;
    min-height: 90px;
    line-height: 1.6;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary:hover  { background: var(--accent-light); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { background: var(--border); cursor: default; }

  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 400;
    cursor: pointer;
    margin-top: 10px;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  .err-msg {
    color: #ff6b6b;
    font-size: 0.8rem;
    text-align: center;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ── BAŞARILI EKRANI ── */
  .success-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 48px 28px 40px;
    text-align: center;
    animation: fadeUp 0.4s ease both;
    display: none;
  }

  .success-icon {
    font-size: 3rem;
    margin-bottom: 14px;
  }

  .success-title {
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--success);
    margin-bottom: 10px;
  }

  .success-desc {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .film-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    text-align: left;
    margin-bottom: 24px;
  }

  .film-preview .fp-name {
    font-weight: 500;
    color: var(--accent-light);
    font-size: 1rem;
    margin-bottom: 4px;
  }

  .film-preview .fp-who {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .film-preview .fp-reason {
    font-size: 0.85rem;
    color: #a0a0c0;
    line-height: 1.6;
  }

  /* ── ÖNERİLER LİSTESİ ── */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 2px;
  }

  .list-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: var(--accent-light);
  }

  .list-count {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
  }

  .oneri-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
    animation: fadeUp 0.3s ease both;
  }

  .oneri-card:hover { border-color: var(--accent); }

  .oneri-card .oc-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .oneri-card .oc-film {
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--accent-light);
  }

  .oneri-card .oc-who {
    font-size: 0.73rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 9px;
  }

  .oneri-card .oc-reason {
    font-size: 0.83rem;
    color: #9090b8;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ── SEKMELEr ── */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .tab {
    flex: 1;
    padding: 9px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s;
    font-weight: 400;
  }

  .tab.active {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="portal-header">
  <h1>İZMİT LİSESİ MOBİL PORTAL</h1>
</div>

<div class="wrapper">

  <!-- SEKMELER -->
  <div class="tabs">
    <div class="tab active" id="tab-form" onclick="switchTab('form')">🎬 Öneri Yap</div>
    <div class="tab" id="tab-list" onclick="switchTab('list')">📋 Öneriler</div>
  </div>

  <!-- FORM BÖLÜMÜ -->
  <div id="section-form">
    <!-- Form kartı -->
    <div class="form-card" id="formCard">
      <div class="form-icon">🎬</div>
      <div class="form-title">Film Önerisi</div>
      <div class="form-sub">Bilgilerini gir ve öneri yap!</div>

      <div class="field-group">
        <label class="field-label">Ad Soyad</label>
        <input class="field-input" id="inp-ad" type="text" placeholder="Örnek: Ahmet Yılmaz">
      </div>

      <div class="row-2">
        <div class="field-group">
          <label class="field-label">Sınıf</label>
          <input class="field-input" id="inp-sinif" type="text" placeholder="Örnek: 11">
        </div>
        <div class="field-group">
          <label class="field-label">Şube</label>
          <input class="field-input" id="inp-sube" type="text" placeholder="Örnek: B">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Film Adı</label>
        <input class="field-input" id="inp-film" type="text" placeholder="Örnek: Inception, Interstellar...">
      </div>

      <div class="field-group">
        <label class="field-label">Neden öneriyorsun? (İsteğe bağlı)</label>
        <textarea class="field-input" id="inp-neden" placeholder="Kısaca açıkla..."></textarea>
      </div>

      <button class="btn-primary" onclick="submitForm()">
        Öneriyi Gönder ✅
      </button>
      <div class="err-msg" id="errMsg"></div>
    </div>

    <!-- Başarı kartı -->
    <div class="success-card" id="successCard">
      <div class="success-icon">✅</div>
      <div class="success-title">Önerin alındı!</div>
      <div class="success-desc">Teşekkürler! Film önerin listeye eklendi.</div>

      <div class="film-preview" id="filmPreview"></div>

      <button class="btn-primary" onclick="resetForm()">
        ＋ Yeni Öneri Yap
      </button>
      <button class="btn-secondary" onclick="switchTab('list')">
        ← Tüm Önerileri Gör
      </button>
    </div>
  </div>

  <!-- LİSTE BÖLÜMÜ -->
  <div id="section-list" style="display:none;">
    <div class="list-header">
      <div class="list-title">Film Önerileri</div>
      <div class="list-count" id="listCount">0 öneri</div>
    </div>
    <div id="oneriList"></div>
  </div>

</div>

<script>
let oneriler = JSON.parse(localStorage.getItem('sinebot_oneriler') || '[]');

function switchTab(tab) {
  document.getElementById('tab-form').classList.toggle('active', tab === 'form');
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('section-form').style.display = tab === 'form' ? 'block' : 'none';
  document.getElementById('section-list').style.display = tab === 'list' ? 'block' : 'none';
  if (tab === 'list') renderList();
}

function submitForm() {
  const ad    = document.getElementById('inp-ad').value.trim();
  const sinif = document.getElementById('inp-sinif').value.trim();
  const sube  = document.getElementById('inp-sube').value.trim();
  const film  = document.getElementById('inp-film').value.trim();
  const neden = document.getElementById('inp-neden').value.trim();
  const err   = document.getElementById('errMsg');

  if (!ad || !sinif || !sube || !film) {
    err.textContent = 'Lütfen zorunlu alanları doldurun.';
    return;
  }

  err.textContent = '';

  const oneri = { ad, sinif, sube, film, neden, tarih: new Date().toLocaleDateString('tr-TR') };
  oneriler.unshift(oneri);
  localStorage.setItem('sinebot_oneriler', JSON.stringify(oneriler));

  // Preview göster
  document.getElementById('filmPreview').innerHTML = `
    <div class="fp-name">${film}</div>
    <div class="fp-who">${ad} — ${sinif}/${sube}</div>
    ${neden ? `<div class="fp-reason">${neden}</div>` : ''}
  `;

  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successCard').style.display = 'block';
}

function resetForm() {
  ['inp-ad','inp-sinif','inp-sube','inp-film','inp-neden'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('errMsg').textContent = '';
  document.getElementById('successCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
}

function renderList() {
  const container = document.getElementById('oneriList');
  const count = document.getElementById('listCount');
  count.textContent = `${oneriler.length} öneri`;

  if (oneriler.length === 0) {
    container.innerHTML = '<div class="empty-state">Henüz öneri yok.<br>İlk öneriyi sen yap!</div>';
    return;
  }

  container.innerHTML = oneriler.map(o => `
    <div class="oneri-card">
      <div class="oc-top">
        <div class="oc-film">${o.film}</div>
        <div class="oc-who">${o.sinif}/${o.sube}</div>
      </div>
      <div class="oc-reason">
        <strong style="color:var(--text);font-weight:500;">${o.ad}</strong>
        ${o.neden ? ' — ' + o.neden : ''}
      </div>
    </div>
  `).join('');
}

// Enter ile gönder
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA') submitForm();
});
</script>
</body>
</html>
